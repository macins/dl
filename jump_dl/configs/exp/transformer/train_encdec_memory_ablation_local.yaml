inherits:
  - ./train_transformer_alibi_moe_nexus.yaml

output_dir: workdirs/jump_dl/encdec_ablation_local

model:
  __replace__: true
  name: encoder_decoder_sequence_regressor
  input_dim: 65
  target_key: ret_30min
  backbone: null

  d_model: 256
  d_ff: 512
  n_heads: 8
  dropout: 0.1
  ffn_activation: swiglu
  use_moe: true
  num_experts: 8
  top_k: 2
  shared_experts: 0

  adapter_type: linear
  adapter_norm: true
  n_local_layers: 2

  use_product_memory: false
  n_product_layers: 0
  use_market_memory: false
  n_market_layers: 0
  use_factor_memory: false
  n_factor_temporal_layers: 0

  n_decoder_layers: 1
  decoder_memory_order: [local]

  num_horizons: 1
  use_horizon_embedding: false
  head_type: linear
  output_mode: single_horizon
