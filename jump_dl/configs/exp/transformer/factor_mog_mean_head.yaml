inherits:
  - train_transformer_alibi.yaml

output_dir: workdirs/jump_dl/factor_mog_mean_head

model:
  head:
    name: conditional_latent_factor_mog
    num_factors: 16
    num_components: 4
    final_step_only: false
    exposure_normalize: true
    market_pooling: mean

objective:
  name: factor_mog_with_aux
  lambda_cos: 1.0
  lambda_mse: 0.1
  lambda_mog_nll: 0.0
  lambda_exposure_orth: 0.0
  lambda_mix_entropy: 0.0
  lambda_aux_multi_horizon: 0.0
